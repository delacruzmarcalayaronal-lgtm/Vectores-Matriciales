services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: matrixflow
      POSTGRES_PASSWORD: matrixflow
      POSTGRES_DB: matrixflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrixflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://matrixflow:matrixflow@db:5432/matrixflow
      SECRET_KEY: dev-secret-cambiar-en-produccion
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_USE_MOCK: "false"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
